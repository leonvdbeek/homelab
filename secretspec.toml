[project]
name = "homelab"
revision = "1.0"

# Proxmox API credentials consumed by both OpenTofu stacks (tofu/truenas and
# tofu/talos). Run tofu through secretspec so these reach the provider as env:
#   secretspec run -- tofu plan
#
# Only PROXMOX_VE_PASSWORD is a real secret — it lives in Bitwarden (the `bw`
# provider). The rest are non-sensitive host facts, kept as defaults here.
[profiles.default]
PROXMOX_VE_PASSWORD = { description = "root@pam password for the m920x Proxmox host", required = true }
PROXMOX_VE_ENDPOINT = { description = "Proxmox API endpoint", required = false, default = "https://m920x.local.leonvdbeek.com:8006/" }
PROXMOX_VE_USERNAME = { description = "Proxmox login (root@pam — needed for tofu/truenas passthrough + args)", required = false, default = "root@pam" }
PROXMOX_VE_INSECURE = { description = "Skip TLS verification against the PVE self-signed cert", required = false, default = "true" }
