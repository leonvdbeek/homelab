---
# Webhook-first registration — uses the data the Proxmox installer sends in the
# post-installation-webhook payload as the primary source. SSH back to the host
# is OPTIONAL enrichment for memory + BIOS strings; if it fails we still ship
# the rest. This makes registration robust to host reboot timing.
- name: Register newly-installed Proxmox host in NetBox (webhook-first)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    netbox_url: "{{ lookup("env", "NETBOX_URL") }}"
    netbox_token: "{{ lookup("env", "NETBOX_TOKEN") }}"
    site_name: "Home"
    role_name: "Hypervisor"

  tasks:
    - name: Persist webhook payload for debugging
      ansible.builtin.copy:
        content: "{{ system_info | default({}) | to_nice_json }}"
        dest: "/app/data/last_webhook.json"
        mode: "0644"
      ignore_errors: true

    - name: Pick management interface from webhook
      ansible.builtin.set_fact:
        nics_raw: "{{ system_info['network-interfaces'] | default([]) }}"

    - name: Extract management iface (is-management==true OR first non-empty address)
      ansible.builtin.set_fact:
        mgmt_iface: >-
          {{ (nics_raw | selectattr('is-management', 'defined')
                       | selectattr('is-management', 'equalto', true)
                       | list | first)
             | default(((nics_raw | selectattr('address', 'defined')
                                  | rejectattr('address', 'equalto', '')
                                  | list) | first) | default((nics_raw | first) | default({}))) }}

    - name: Webhook-derived facts
      ansible.builtin.set_fact:
        cpu_model: "{{ system_info['cpu-info'].model | default('') }}"
        cpu_sockets: "{{ system_info['cpu-info'].sockets | default(0) | int }}"
        cpu_cores: "{{ system_info['cpu-info'].cores | default(0) | int }}"
        device_serial: "{{ system_info.dmi.system.serial | default('') }}"
        device_uuid: "{{ system_info.dmi.system.uuid | default('') }}"
        sys_sku: "{{ system_info.dmi.system.sku | default('') }}"
        sys_dmi_name: "{{ system_info.dmi.system.name | default('') }}"
        chassis_asset: "{{ system_info.dmi.chassis.asset_tag | default('') }}"
        webhook_fqdn: "{{ system_info.fqdn | default('') }}"
        pve_version: "{{ system_info.product.version | default('') }}"
        target_ip_cidr: "{{ mgmt_iface.address | default('') }}"

    - name: Strip /CIDR
      ansible.builtin.set_fact:
        target_ip: "{{ target_ip_cidr.split('/') | first | default('') }}"
        manufacturer_name: "{{ ((sys_sku.split('_') | first) | default('Unknown', true)) | upper }}"
        model_name: >-
          {{ (sys_sku.split('FM_') | last | trim) if 'FM_' in sys_sku
             else (sys_dmi_name | default('Unknown') | trim) }}
        device_name: >-
          {{ (webhook_fqdn.split('.') | first) if webhook_fqdn | length > 0
             else ('pve-' ~ device_serial if device_serial
                   else ('pve-' ~ ((mgmt_iface.mac | default('')) | replace(':','')))) }}

    - name: Build NIC list for NetBox
      ansible.builtin.set_fact:
        nics: |-
          {%- set out = [] -%}
          {%- for n in nics_raw -%}
          {%-   set u = n.get('udev-properties', {}) -%}
          {%-   set _ = out.append({
                  'name': n.name,
                  'mac': n.mac | default(''),
                  'address': n.address | default(''),
                  'is_mgmt': n['is-management'] | default(false),
                  'vendor': u.get('ID_VENDOR_FROM_DATABASE', ''),
                  'model': u.get('ID_MODEL_FROM_DATABASE', '') }) -%}
          {%- endfor -%}
          {{ out }}

    - name: Build disk list for NetBox
      ansible.builtin.set_fact:
        disks: |-
          {%- set out = [] -%}
          {%- for d in system_info.disks | default([]) -%}
          {%-   set u = d.get('udev-properties', {}) -%}
          {%-   set _ = out.append({
                  'name': (u.get('DEVNAME', '/dev/disk') | basename),
                  'model': (u.get('ID_MODEL_FROM_DATABASE', '') or u.get('ID_MODEL', '')) | replace('_', ' '),
                  'serial': u.get('ID_SERIAL_SHORT', ''),
                  'vendor': u.get('ID_VENDOR_FROM_DATABASE', '') or (u.get('ID_BUS', '') | upper),
                  'size_bytes': d.size | default(0) | int,
                  'is_boot': d.get('is-bootdisk', false) }) -%}
          {%- endfor -%}
          {{ out }}

    - name: Webhook-derived summary
      ansible.builtin.debug:
        msg: >-
          {{ device_name }} | {{ manufacturer_name }} {{ model_name }} |
          {{ cpu_cores }}C/{{ cpu_sockets }}S {{ cpu_model }} |
          {{ nics | length }} NICs | {{ disks | length }} disks |
          mgmt={{ target_ip }}/{{ target_ip_cidr.split('/')[1] | default('') }}

    # ─── Optional SSH enrichment for fields the webhook doesn't have ───
    - name: Try SSH enrichment (memory + BIOS strings)
      block:
        - ansible.builtin.add_host:
            name: target_pve
            ansible_host: "{{ target_ip }}"
            ansible_user: root
            ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10"
            groups: pve_new
        - ansible.builtin.wait_for_connection:
            timeout: 600
            delay: 10
            sleep: 15
          delegate_to: target_pve
        - ansible.builtin.setup:
          delegate_to: target_pve
          delegate_facts: true
        - ansible.builtin.set_fact:
            memory_gb: "{{ ((hostvars['target_pve'].ansible_memtotal_mb | default(0) | int) / 1024) | round(0, 'floor') | int }}"
            bios_vendor: "{{ hostvars['target_pve'].ansible_bios_vendor | default('') | trim }}"
            bios_version: "{{ hostvars['target_pve'].ansible_bios_version | default('') | trim }}"
            ssh_enriched: true
      rescue:
        - ansible.builtin.set_fact:
            memory_gb: 0
            bios_vendor: ""
            bios_version: ""
            ssh_enriched: false
        - ansible.builtin.debug:
            msg: "SSH enrichment skipped/failed — registering webhook data only"

    # ─── NetBox writes (all on localhost; no SSH dependency) ───
    - name: Ensure manufacturer
      netbox.netbox.netbox_manufacturer:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
        data: { name: "{{ manufacturer_name }}" }
        state: present

    - name: Ensure device-type
      netbox.netbox.netbox_device_type:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
        data:
          manufacturer: "{{ manufacturer_name }}"
          model: "{{ model_name }}"
          u_height: 1
        state: present

    - name: Register/update device
      netbox.netbox.netbox_device:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
        data:
          name: "{{ device_name }}"
          device_type: "{{ model_name }}"
          device_role: "{{ role_name }}"
          site: "{{ site_name }}"
          serial: "{{ device_serial }}"
          asset_tag: "{{ chassis_asset if chassis_asset else omit }}"
          status: "active"
          tags: ["auto-registered", "pve"]
          custom_fields:
            cpu_model: "{{ cpu_model }}"
            cpu_sockets: "{{ cpu_sockets }}"
            cpu_cores: "{{ cpu_cores }}"
            memory_gb: "{{ memory_gb }}"
            bios_vendor: "{{ bios_vendor }}"
            bios_version: "{{ bios_version }}"
            system_uuid: "{{ device_uuid }}"
            system_sku: "{{ sys_sku }}"
            pve_version: "{{ pve_version }}"
        state: present

    - name: Add physical NICs
      netbox.netbox.netbox_device_interface:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
        data:
          device: "{{ device_name }}"
          name: "{{ item.name }}"
          type: "1000base-t"
          enabled: true
          description: "{{ (item.vendor ~ ' ' ~ item.model) | trim }}"
        state: present
      loop: "{{ nics }}"

    - name: Add vmbr0 (PVE management bridge)
      netbox.netbox.netbox_device_interface:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
        data:
          device: "{{ device_name }}"
          name: "vmbr0"
          type: "bridge"
          enabled: true
        state: present

    - name: Attach MAC addresses to NICs
      netbox.netbox.netbox_mac_address:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
        data:
          mac_address: "{{ item.mac }}"
          assigned_object:
            device: "{{ device_name }}"
            name: "{{ item.name }}"
        state: present
      loop: "{{ nics }}"
      when: item.mac | length > 0

    - name: Attach management MAC also to vmbr0
      netbox.netbox.netbox_mac_address:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
        data:
          mac_address: "{{ mgmt_iface.mac }}"
          assigned_object:
            device: "{{ device_name }}"
            name: "vmbr0"
        state: present
      when: mgmt_iface.mac is defined and mgmt_iface.mac | length > 0

    - name: Register management IP on vmbr0
      netbox.netbox.netbox_ip_address:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
        data:
          address: "{{ target_ip_cidr }}"
          status: active
          assigned_object:
            device: "{{ device_name }}"
            name: "vmbr0"
        state: present
      when: target_ip_cidr | length > 0

    - name: Look up device id (for primary IP patch)
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/dcim/devices/?name={{ device_name }}"
        headers: { Authorization: "Bearer {{ netbox_token }}" }
      register: dev_lookup

    - name: Look up IP id
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/ipam/ip-addresses/?address={{ target_ip_cidr }}"
        headers: { Authorization: "Bearer {{ netbox_token }}" }
      register: ip_lookup
      when: target_ip_cidr | length > 0

    - name: Set primary_ip4 on device
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/dcim/devices/{{ dev_lookup.json.results[0].id }}/"
        method: PATCH
        headers:
          Authorization: "Bearer {{ netbox_token }}"
          Content-Type: "application/json"
        body_format: json
        body: { primary_ip4: "{{ ip_lookup.json.results[0].id }}" }
        status_code: [200]
      when:
        - ip_lookup is defined
        - ip_lookup.json is defined
        - ip_lookup.json.count | default(0) > 0
        - dev_lookup.json.count | default(0) > 0

    - name: Add disks as inventory items
      netbox.netbox.netbox_inventory_item:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
        data:
          device: "{{ device_name }}"
          name: "{{ item.name }}"
          serial: "{{ item.serial }}"
          part_id: "{{ item.model }}"
          description: "{{ item.vendor }} | {{ (item.size_bytes / 1073741824) | round(0, 'floor') | int }} GB{{ ' (boot)' if item.is_boot else '' }}"
        state: present
      loop: "{{ disks }}"

    - name: Final summary
      ansible.builtin.debug:
        msg: >-
          NetBox: {{ device_name }} | {{ manufacturer_name }} {{ model_name }} |
          mgmt={{ target_ip }} | {{ nics | length }} NICs | {{ disks | length }} disks |
          ssh_enriched={{ ssh_enriched }}
