- name: Install node_exporter on apt/proxmox hosts
  hosts: apt:proxmox
  gather_facts: no
  become: true
  tasks:
    - name: install prometheus-node-exporter
      apt:
        name: prometheus-node-exporter
        state: present
        update_cache: yes
    - name: ensure node_exporter enabled + running on :9100
      service:
        name: prometheus-node-exporter
        state: started
        enabled: yes
    - name: report endpoint
      debug:
        msg: "node_exporter up (host {{ ansible_host }}) -- expected localhost:9100/metrics"