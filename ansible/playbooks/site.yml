---
- name: Apply base config to all Proxmox hosts
  hosts: pve_hosts
  gather_facts: true
  roles:
    - role: base
      tags: [base]
    - role: proxmox-cert
      tags: [cert]
    - role: monitoring-node
      tags: [monitoring]

- name: Deploy observability stack on the docker host
  hosts: cert_source
  gather_facts: false
  roles:
    - role: observability-stack
      tags: [observability]
