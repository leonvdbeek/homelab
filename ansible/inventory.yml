all:
  children:
    proxmox:
      hosts:
        m920x:
          ansible_host: m920x.local.leonvdbeek.com
          ansible_user: root
  vars:
    ansible_port: 22
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    # Disruptive actions (host reboot) are opt-in so the base runbook is safe to
    # re-run. Override per-run with: -e pve_allow_reboot=true
    pve_allow_reboot: false
