---
# node_exporter — runs on every PVE host, exposes :9100
node_exporter_listen_port: 9100

# pve-exporter — runs ONLY on lenovo-01 (queries the whole cluster API).
# Prometheus uses ?target=<node> to fan out per-node metrics.
pve_exporter_host: lenovo-01
pve_exporter_listen_port: 9221
pve_exporter_user: pve-exporter
pve_exporter_venv: /opt/pve-exporter
pve_exporter_config: /etc/prometheus/pve.yml
pve_exporter_pve_user: pve-exporter@pve
pve_exporter_pve_token_id: exporter
