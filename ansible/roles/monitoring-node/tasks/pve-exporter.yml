---
- name: Install Python venv tooling
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-pip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create pve-exporter system user
  ansible.builtin.user:
    name: "{{ pve_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ pve_exporter_venv }}"
    create_home: false

- name: Create pve-exporter venv directory
  ansible.builtin.file:
    path: "{{ pve_exporter_venv }}"
    state: directory
    owner: "{{ pve_exporter_user }}"
    group: "{{ pve_exporter_user }}"
    mode: "0755"

- name: Install prometheus-pve-exporter into venv
  ansible.builtin.pip:
    name: prometheus-pve-exporter
    virtualenv: "{{ pve_exporter_venv }}"
    virtualenv_command: python3 -m venv
    state: latest
  become_user: "{{ pve_exporter_user }}"
  notify: restart pve-exporter

- name: Ensure /etc/prometheus exists for the config
  ansible.builtin.file:
    path: /etc/prometheus
    state: directory
    owner: root
    group: "{{ pve_exporter_user }}"
    mode: "0750"

# ─── PVE auth: dedicated read-only user + token ───────────────────────────
- name: Check if PVE user {{ pve_exporter_pve_user }} exists
  ansible.builtin.command: pveum user list --output-format json
  register: pveum_users
  changed_when: false

- name: Create PVE user for the exporter
  ansible.builtin.command: >-
    pveum user add {{ pve_exporter_pve_user }}
    --comment "Read-only metrics exporter"
  when: (pveum_users.stdout | from_json) | selectattr('userid', 'equalto', pve_exporter_pve_user) | list | length == 0

- name: Grant PVEAuditor role on the cluster root
  ansible.builtin.command: >-
    pveum acl modify /
    --users {{ pve_exporter_pve_user }}
    --roles PVEAuditor
  changed_when: false   # pveum acl modify is naturally idempotent

- name: Stat existing exporter config
  ansible.builtin.stat:
    path: "{{ pve_exporter_config }}"
  register: pve_cfg

# Token is regenerated only if no config file exists yet — the secret value
# returned by `pveum user token add` is unrecoverable, so we capture it the
# moment we mint it, write the config, and never look back.
- name: Remove any leftover token before re-minting
  ansible.builtin.command: >-
    pveum user token remove
    {{ pve_exporter_pve_user }}
    {{ pve_exporter_pve_token_id }}
  when: not pve_cfg.stat.exists
  changed_when: false
  failed_when: false

- name: Mint a fresh API token
  ansible.builtin.command: >-
    pveum user token add
    {{ pve_exporter_pve_user }}
    {{ pve_exporter_pve_token_id }}
    --privsep 0
    --output-format json
  register: pve_token_out
  when: not pve_cfg.stat.exists
  no_log: true

- name: Render pve-exporter config
  ansible.builtin.template:
    src: pve.yml.j2
    dest: "{{ pve_exporter_config }}"
    owner: root
    group: "{{ pve_exporter_user }}"
    mode: "0640"
  when: not pve_cfg.stat.exists
  vars:
    pve_exporter_token: "{{ (pve_token_out.stdout | from_json).value }}"
  no_log: true
  notify: restart pve-exporter

# ─── Service ──────────────────────────────────────────────────────────────
- name: Install pve-exporter systemd unit
  ansible.builtin.template:
    src: pve-exporter.service.j2
    dest: /etc/systemd/system/pve-exporter.service
    mode: "0644"
  notify: restart pve-exporter

- name: Enable and start pve-exporter
  ansible.builtin.systemd:
    name: pve-exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Verify pve-exporter is listening
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ pve_exporter_listen_port }}"
    timeout: 10
