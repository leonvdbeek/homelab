apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-dns

resources:
  - namespace.yaml
  - externalsecret.yaml
  # `cloudflare-api-token` materialized by ESO from Vault path
  # `kv/cloudflare/api-token` (shared with cert-manager).

helmCharts:
  - name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns/
    version: "1.15.0"
    releaseName: external-dns
    namespace: external-dns
    valuesFile: values.yaml
