apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-dns

resources:
  - namespace.yaml
  # secret.enc.yaml (Cloudflare API token) is sops-encrypted; apply it
  # out-of-band: `sops -d secret.enc.yaml | kubectl apply -f -`.

helmCharts:
  - name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns/
    version: "1.15.0"
    releaseName: external-dns
    namespace: external-dns
    valuesFile: values.yaml
