apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik

resources:
  - namespace.yaml
  - httproute.yaml
  - externalsecret.yaml
  # The `authentik-secrets` Secret is materialized by ESO from
  # `kv/authentik/secrets` in Vault. To rotate a value:
  #   vault kv patch kv/authentik/secrets KEY=newvalue
  # ESO picks it up within `refreshInterval` (default 1h). Force an
  # immediate refresh with:
  #   kubectl -n authentik annotate externalsecret authentik-secrets force-sync=$(date +%s) --overwrite

# Glue every blueprint YAML into one ConfigMap that the helm chart
# mounts at /blueprints/local/. Server + worker pods re-read these on
# startup.
configMapGenerator:
  - name: authentik-blueprints
    files:
      - blueprints/brand.yaml
      - blueprints/groups.yaml
      - blueprints/proxy-outpost.yaml
      - blueprints/apps-oidc.yaml
    options:
      disableNameSuffixHash: true

helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    version: "2024.12.2"
    releaseName: authentik
    namespace: authentik
    valuesFile: values.yaml
