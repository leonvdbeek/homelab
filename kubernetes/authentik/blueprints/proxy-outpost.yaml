# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# The forward-auth provider used by every non-OIDC-native app behind
# Traefik (and, going forward, behind the Cilium Gateway). Mode is
# forward_domain — Traefik calls /outpost.goauthentik.io/auth/traefik
# at https://authentik.leonvdbeek.com, the outpost validates the
# session, and the user is bounced to authentik.leonvdbeek.com for
# login if no session cookie is present. cookie_domain=leonvdbeek.com
# means the SSO cookie covers every subdomain in one hop.
version: 1
metadata:
  name: Proxy provider — outpost
entries:
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Provider for outpost"
    attrs:
      mode: forward_domain
      external_host: https://authentik.leonvdbeek.com
      cookie_domain: leonvdbeek.com
      basic_auth_enabled: false
      intercept_header_auth: true
      access_token_validity: hours=24
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/proxy/scope-proxy"]]

  - model: authentik_core.application
    identifiers:
      slug: outpost
    attrs:
      name: outpost
      provider: !Find [authentik_core.provider, [name, "Provider for outpost"]]
    state: present

  - model: authentik_outposts.outpost
    identifiers:
      name: "authentik Embedded Outpost"
    attrs:
      type: proxy
      providers:
        - !Find [authentik_core.provider, [name, "Provider for outpost"]]
      config:
        # Embedded outpost — uses the authentik-server pods directly.
        authentik_host: ""
        authentik_host_browser: ""
        log_level: info
        object_naming_template: "ak-outpost-%(name)s"
