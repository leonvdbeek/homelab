---
# Pulls every AUTHENTIK_* env var from Vault into the authentik-secrets
# Secret. The Secret shape (name, keys) is identical to the sops file
# it replaces, so the chart's envFrom keeps working unchanged.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: authentik/secrets
