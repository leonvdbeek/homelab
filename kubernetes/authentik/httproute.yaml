---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  parentRefs:
    - name: lan
      namespace: gateway
      sectionName: https
  hostnames:
    - authentik.leonvdbeek.com
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
---
# Outpost forward-auth endpoint — Traefik or Cilium can use this to
# protect any other HTTPRoute via ExtAuthz. For now it's reachable
# directly at /outpost.goauthentik.io/* so existing forward-auth
# integrations keep working.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-to-authentik
  namespace: authentik
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: gateway
  to:
    - group: ""
      kind: Service
