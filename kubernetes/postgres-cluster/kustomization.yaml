apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: postgres

resources:
  - namespace.yaml
  - cluster.yaml
  - databases.yaml
  # Per-role basic-auth Secrets (authentik-db, vaultwarden-db, …) are
  # materialized by ESO from Vault. CNPG reconciles role passwords
  # against these Secrets continuously, so updates flow through to
  # Postgres on the next ESO refresh (default 1h).
  - externalsecret.yaml
