---
# The Deployment's envFrom: vaultwarden-secrets supplies VW_DB_PASSWORD
# and ADMIN_TOKEN. The matching basic-auth Secret used by CNPG
# (vaultwarden-db in `postgres` namespace) is materialized from the
# same Vault tenant in ../postgres-cluster/externalsecret.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vaultwarden-secrets
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vaultwarden-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: vaultwarden/app
