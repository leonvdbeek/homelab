apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vaultwarden

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - externalsecret.yaml
  # The `vaultwarden-secrets` Secret in this namespace (DB password +
  # admin token) is materialized by ESO from `kv/vaultwarden/app`.
  # The matching `vaultwarden-db` basic-auth Secret CNPG reads is
  # materialized in the `postgres` namespace via
  # ../postgres-cluster/externalsecret.yaml from `kv/vaultwarden/db`.
  # The RSA signing key lives on the shared /data PVC (CephFS), not in
  # a Secret — Vaultwarden auto-generates it on first boot, and the
  # migration runbook overwrites it with the key copied from portainer.
