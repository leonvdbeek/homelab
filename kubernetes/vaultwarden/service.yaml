---
# ClusterIP fronting the 2-replica Deployment. No session affinity is
# needed — both pods read/write the same /data on CephFS, so any
# request can land on any pod.
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  type: ClusterIP
  selector:
    app: vaultwarden
  ports:
    - port: 80
      targetPort: 8080
      name: http
