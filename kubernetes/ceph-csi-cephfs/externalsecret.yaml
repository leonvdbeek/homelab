---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: csi-cephfs-secret
  namespace: ceph-csi-cephfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: csi-cephfs-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ceph-csi-cephfs/csi-cephfs-secret
