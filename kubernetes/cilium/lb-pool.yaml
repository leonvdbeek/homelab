---
# LoadBalancer IP pool advertised on the LAN. Confirmed free in UniFi
# DHCP carve-out: 192.168.4.240-250 (11 IPs).
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan
spec:
  blocks:
    - start: "192.168.4.240"
      stop: "192.168.4.250"
---
# Tell Cilium to ARP-respond for any LB IP on all node interfaces.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan
spec:
  loadBalancerIPs: true
  externalIPs: false
  # Match every node — small cluster, no zoning.
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
