# kube-prometheus-stack values, tuned for our 3-node Talos cluster.
# Reference: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack

# We already run Grafana centrally on the portainer host — disable the
# bundled one and add the in-cluster Prometheus as a *second* datasource
# from the central Grafana.
grafana:
  enabled: false

# Skip alertmanager for now — central monitoring will own alerting later.
alertmanager:
  enabled: false

# Talos quirks ─────────────────────────────────────────────────────────────
# Talos uses Cilium → no kube-proxy.
kubeProxy:
  enabled: false

# Talos doesn't expose etcd metrics by default. Skip rather than break.
kubeEtcd:
  enabled: false

# Bind kube-controller-manager and kube-scheduler metrics endpoints onto
# the node IPs explicitly so the ServiceMonitor can reach them.
kubeControllerManager:
  endpoints:
    - 192.168.4.61
    - 192.168.4.11
    - 192.168.4.121
  service:
    enabled: true
    port: 10257
    targetPort: 10257
  serviceMonitor:
    https: true
    insecureSkipVerify: true

kubeScheduler:
  endpoints:
    - 192.168.4.61
    - 192.168.4.11
    - 192.168.4.121
  service:
    enabled: true
    port: 10259
    targetPort: 10259
  serviceMonitor:
    https: true
    insecureSkipVerify: true

# Prometheus exposed on every node port 30090 so the central Prom (and the
# central Grafana) can reach it directly without an ingress controller.
prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    retention: 7d
    # No PV — emptyDir keeps things simple. 7d retention fits in pod memory/disk.
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
