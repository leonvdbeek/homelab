---
# ClusterSecretStore lets ExternalSecret resources in any namespace
# fetch from this Vault. Authentication is `kubernetes` auth, using
# ESO's controller ServiceAccount as the identity — Vault validates
# the SA token via TokenReview against the cluster's API.
#
# All paths live under the `kv/` KV v2 mount; ESO's bound role has
# read on `kv/data/*` (see vault/README.md for the bootstrap).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault-active.vault.svc.cluster.local:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
