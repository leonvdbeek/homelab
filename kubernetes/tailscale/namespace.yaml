apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    # Subnet-router pods set up iptables/netfilter and bind to a TUN
    # device, which needs privileged + NET_ADMIN. Talos defaults to
    # PodSecurity `baseline:latest`, which would block that.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
