---
# Tiny nginx that does what Cilium 1.16's URLRewrite/RequestHeaderModifier
# refused to: strip the `.lenovium` from the incoming Host header so the
# request becomes <svc>.leonvdbeek.com, then proxy to portainer's Traefik
# on 192.168.4.73:443 with the right SNI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: portainer-proxy
data:
  default.conf: |
    server {
      listen 80 default_server;
      # Capture the first label of the hostname (the service name).
      server_name ~^(?<svc>[^.]+)\.lenovium\.leonvdbeek\.com$;

      location / {
        proxy_set_header Host                $svc.leonvdbeek.com;
        proxy_set_header X-Forwarded-For     $remote_addr;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-Proto   https;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Upstream is portainer's Traefik on HTTPS. Use SNI matching the
        # rewritten Host so Traefik picks the right cert. `verify off`
        # because Traefik may present a per-service LE cert and we don't
        # want to maintain a CA bundle in here.
        proxy_ssl_server_name on;
        proxy_ssl_name        $svc.leonvdbeek.com;
        proxy_ssl_verify      off;

        proxy_pass https://192.168.4.73;

        # WebSocket / long-poll friendliness — most services here need
        # one or the other (jellyfin, home assistant, nextcloud chat...).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
      }
    }

    # Connection mapping for the WebSocket Upgrade header above.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      '';
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: portainer-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: portainer-proxy
  namespace: portainer-proxy
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      name: http
