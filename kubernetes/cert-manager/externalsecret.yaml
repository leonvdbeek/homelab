---
# Cloudflare API token consumed by cert-manager's ClusterIssuer for
# the Let's Encrypt DNS-01 solver. The same token is also pulled
# (independently) by external-dns from the same Vault path.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cloudflare/api-token
