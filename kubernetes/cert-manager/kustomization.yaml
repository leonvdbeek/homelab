apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - cluster-issuer.yaml
  - wildcard-cert.yaml
  # secret.enc.yaml (Cloudflare API token) is sops-encrypted; apply it
  # out-of-band: `sops -d secret.enc.yaml | kubectl apply -f -`.
  # See ../README.md for the bring-up sequence.

helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: "v1.16.2"
    releaseName: cert-manager
    namespace: cert-manager
    valuesFile: values.yaml
    includeCRDs: true
