apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - cluster-issuer.yaml
  - wildcard-cert.yaml
  - externalsecret.yaml
  # `cloudflare-api-token` Secret materialized by ESO from Vault path
  # `kv/cloudflare/api-token`. Same token re-used by external-dns from
  # the same Vault entry (independent ExternalSecret in that namespace).

helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: "v1.16.2"
    releaseName: cert-manager
    namespace: cert-manager
    valuesFile: values.yaml
    includeCRDs: true
