# Helm values for sergelogvinov/proxmox-csi-plugin.
# The Proxmox API config (URL + token) is rendered into a Secret by tofu —
# see ../../tofu/talos/csi.tf — and consumed here via existingConfigSecret.

existingConfigSecret: proxmox-csi-plugin
existingConfigSecretKey: config.yaml

storageClass:
  - name: proxmox-ceph-pool
    storage: ceph-pool
    reclaimPolicy: Delete
    fstype: ext4
    ssd: "true"

# All Talos VMs are control-plane (compact 3-node cluster). Schedule the
# controller on a CP node; the node DaemonSet runs on each automatically.
nodeSelector:
  node-role.kubernetes.io/control-plane: ""

tolerations:
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule

# The CSI controller calls the Proxmox API using the short hostnames that
# Proxmox itself reports for each node (`lenovo-01/-02/-03`). Inside the
# pod we don't share my workstation's DHCP-provided search domain, so the
# bare names won't resolve via CoreDNS. The chart doesn't expose
# `dnsConfig.searches`, so we pin /etc/hosts entries instead — same fix,
# fewer moving parts. Re-IP a node? Update the IPs here and re-apply.
hostAliases:
  - ip: 192.168.4.79
    hostnames: [lenovo-01]
  - ip: 192.168.4.76
    hostnames: [lenovo-02]
  - ip: 192.168.4.29
    hostnames: [lenovo-03]
