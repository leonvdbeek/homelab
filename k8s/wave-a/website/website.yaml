# website-lvdbk (www.leonvdbeek.com) — stateless, no PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: apps
spec:
  replicas: 1
  selector: {matchLabels: {app: website}}
  template:
    metadata: {labels: {app: website}}
    spec:
      containers:
        - name: website
          image: leonvdbeek/lvdbk.live:latest
          ports: [{name: http, containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: apps
spec:
  selector: {app: website}
  ports: [{name: http, port: 80, targetPort: 80}]