# Let's Encrypt certs + Traefik IngressRoutes for the Wave A apps.
# Certs are requested via cert-manager (ClusterIssuer 'letsencrypt', DNS-01).
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: home-cert, namespace: apps}
spec:
  secretName: home-cert
  dnsNames: [home.leonvdbeek.com, homepage.leonvdbeek.com]
  issuerRef: {name: letsencrypt, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: ntfy-cert, namespace: apps}
spec:
  secretName: ntfy-cert
  dnsNames: [ntfy.leonvdbeek.com]
  issuerRef: {name: letsencrypt, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: uptime-cert, namespace: apps}
spec:
  secretName: uptime-cert
  dnsNames: [uptime.leonvdbeek.com]
  issuerRef: {name: letsencrypt, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: www-cert, namespace: apps}
spec:
  secretName: www-cert
  dnsNames: [www.leonvdbeek.com]
  issuerRef: {name: letsencrypt, kind: ClusterIssuer}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: home-route, namespace: apps}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`home.leonvdbeek.com`) || Host(`homepage.leonvdbeek.com`)
      kind: Rule
      services: [{name: homepage, port: 3000}]
  tls: {secretName: home-cert}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: ntfy-route, namespace: apps}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`ntfy.leonvdbeek.com`)
      kind: Rule
      services: [{name: ntfy, port: 80}]
  tls: {secretName: ntfy-cert}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: uptime-route, namespace: apps}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`uptime.leonvdbeek.com`)
      kind: Rule
      services: [{name: uptime-kuma, port: 3001}]
  tls: {secretName: uptime-cert}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: website-route, namespace: apps}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`www.leonvdbeek.com`)
      kind: Rule
      services: [{name: website, port: 80}]
  tls: {secretName: www-cert}
---
# HTTP → HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: redirect-https, namespace: apps}
spec:
  redirectScheme: {scheme: https, permanent: true}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: https-redirect, namespace: apps}
spec:
  entryPoints: [web]
  routes:
    - match: HostRegexp(`{host:.+}`)
      kind: Rule
      middlewares: [{name: redirect-https}]
      services: [{name: website, port: 80}]