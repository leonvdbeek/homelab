# Static Traefik config mounted into the ingress controller.
# Certificates are issued via Cloudflare DNS-01 (reuses the .73 traefik's
# Cloudflare API key + email; KS cluster runs inside the homelab repo).
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  namespace: traefik
data:
  traefik.yaml: |
    api:
      insecure: true
    entryPoints:
      web:
        address: ":80"
      websecure:
        address: ":443"
    providers:
      kubernetescrd: {}