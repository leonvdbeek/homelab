# Let's Encrypt ClusterIssuer using Cloudflare DNS-01.
# Reuses the Cloudflare global API key / email that the docker-host traefik uses.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: leon.vandebeek@xs4all.nl
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            # Scoped API token (Zone.DNS:Edit, from the UniFi DDNS config). The
            # global CF API key and the invalid recursiveNameservers field (no
            # such cert-manager schema path) were red herrings — this token
            # publishes challenge TXTs within seconds.
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token