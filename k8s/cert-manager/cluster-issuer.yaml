# Let's Encrypt ClusterIssuer using Cloudflare DNS-01.
# Reuses the Cloudflare global API key / email that the docker-host traefik uses.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: leon.vandebeek@xs4all.nl
    privateKeySecretRef:
      name: letsencrypt-account-key
    dns01:
      # Check TXT propagation via public resolvers (cluster CoreDNS doesn't
      # resolve the challenge reliably on this homelab).
      recursiveNameservers: ["1.1.1.1:53", "8.8.8.8:53"]
      recursiveNameserversOnly: true
    solvers:
      - dns01:
          cloudflare:
            # Scoped API token (from the UniFi DDNS config) with Zone.DNS:Edit.
            # The global CF API key stores but does NOT publish challenge TXTs on
            # this zone; this token publishes them within seconds.
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token