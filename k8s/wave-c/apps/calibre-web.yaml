# calibre-web — config + library migrated from .73 /home/leon/portainer/calibre
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-config
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: truenas-iscsi-fast
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-library
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: truenas-iscsi-fast
  resources: {requests: {storage: 4Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
  namespace: apps
spec:
  replicas: 1
  selector: {matchLabels: {app: calibre-web}}
  template:
    metadata: {labels: {app: calibre-web}}
    spec:
      containers:
        - name: calibre-web
          image: lscr.io/linuxserver/calibre-web:latest
          env: [{name: PUID, value: "1000"}, {name: PGID, value: "1000"}, {name: TZ, value: Europe/Amsterdam}]
          ports: [{name: http, containerPort: 8083}]
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: library, mountPath: /books}
          readinessProbe: {httpGet: {path: /, port: 8083}, initialDelaySeconds: 10}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: calibre-config}
        - name: library
          persistentVolumeClaim: {claimName: calibre-library}
---
apiVersion: v1
kind: Service
metadata:
  name: calibre-web
  namespace: apps
spec:
  type: NodePort
  selector: {app: calibre-web}
  ports: [{name: http, port: 8083, targetPort: 8083, nodePort: 30883}]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: calibre-cert, namespace: apps}
spec:
  secretName: calibre-cert
  dnsNames: [calibre.leonvdbeek.com]
  issuerRef: {name: letsencrypt, kind: ClusterIssuer}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: calibre-route, namespace: apps}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`calibre.leonvdbeek.com`)
      kind: Rule
      services: [{name: calibre-web, port: 8083}]
  tls: {secretName: calibre-cert}