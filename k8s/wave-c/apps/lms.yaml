# LMS (Lyrion music server) — config/playlist migrated from .73; music via PVC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lms-config
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: truenas-iscsi-fast
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lms-music
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: truenas-iscsi-fast
  resources: {requests: {storage: 8Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms
  namespace: apps
spec:
  replicas: 1
  selector: {matchLabels: {app: lms}}
  template:
    metadata: {labels: {app: lms}}
    spec:
      containers:
        - name: lms
          image: lmscommunity/lyrionmusicserver:latest
          env: [{name: TZ, value: Europe/Amsterdam}]
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: music, mountPath: /music}
          readinessProbe: {tcpSocket: {port: 9000}, initialDelaySeconds: 15}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: lms-config}
        - name: music
          persistentVolumeClaim: {claimName: lms-music}
---
apiVersion: v1
kind: Service
metadata:
  name: lms
  namespace: apps
spec:
  type: NodePort
  selector: {app: lms}
  ports: [{name: http, port: 9000, targetPort: 9000, nodePort: 30900}]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: lms-cert, namespace: apps}
spec:
  secretName: lms-cert
  dnsNames: [lms.leonvdbeek.com]
  issuerRef: {name: letsencrypt, kind: ClusterIssuer}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: lms-route, namespace: apps}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`lms.leonvdbeek.com`)
      kind: Rule
      services: [{name: lms, port: 9000}]
  tls: {secretName: lms-cert}