# stash-vr — VR companion to stash; stateless (no PVC).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stash-vr
  namespace: apps
spec:
  replicas: 1
  selector: {matchLabels: {app: stash-vr}}
  template:
    metadata: {labels: {app: stash-vr}}
    spec:
      containers:
        - name: stash-vr
          image: ofl0w/stash-vr:latest
          ports: [{name: http, containerPort: 9666}]
          readinessProbe: {httpGet: {path: /, port: 9666}, initialDelaySeconds: 10}
---
apiVersion: v1
kind: Service
metadata:
  name: stash-vr
  namespace: apps
spec:
  type: NodePort
  selector: {app: stash-vr}
  ports: [{name: http, port: 9666, targetPort: 9666, nodePort: 30966}]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: stashvr-cert, namespace: apps}
spec:
  secretName: stashvr-cert
  dnsNames: [stashvr.leonvdbeek.com]
  issuerRef: {name: letsencrypt, kind: ClusterIssuer}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: stashvr-route, namespace: apps}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`stashvr.leonvdbeek.com`)
      kind: Rule
      services: [{name: stash-vr, port: 9666}]
  tls: {secretName: stashvr-cert}