# website-lvdbk (www.leonvdbeek.com) — stateless, no PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: apps
spec:
  replicas: 1
  selector: {matchLabels: {app: website}}
  template:
    metadata: {labels: {app: website}}
    spec:
      containers:
        - name: website
          image: leonvdbeek/lvdbk.live:latest
          ports: [{name: http, containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: apps
spec:
  selector: {app: website}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: www-cert, namespace: apps}
spec:
  secretName: www-cert
  dnsNames: [www.leonvdbeek.com]
  issuerRef: {name: letsencrypt, kind: ClusterIssuer}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: website-route, namespace: apps}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`www.leonvdbeek.com`)
      kind: Rule
      services: [{name: website, port: 80}]
  tls: {secretName: www-cert}