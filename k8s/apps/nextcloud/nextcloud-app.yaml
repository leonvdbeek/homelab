# Nextcloud application (v35 series) + service + internal route.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: apps
spec:
  replicas: 1
  selector: {matchLabels: {app: nextcloud}}
  template:
    metadata: {labels: {app: nextcloud}}
    spec:
      containers:
        - name: nextcloud
          image: nextcloud:35
          envFrom: [{secretRef: {name: nextcloud-db-secret}}]
          env:
            - {name: MYSQL_HOST, value: mariadb}   # in-cluster DB service
          ports: [{name: http, containerPort: 80}]
          volumeMounts: [{name: www, mountPath: /var/www/html}]
          readinessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders: [{name: Host, value: nextcloud.talos}]
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders: [{name: Host, value: nextcloud.talos}]
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: www
          persistentVolumeClaim: {claimName: nextcloud-www}
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: apps
spec:
  selector: {app: nextcloud}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: nextcloud-talos, namespace: apps}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`nextcloud.talos`)
      kind: Rule
      services: [{name: nextcloud, port: 80}]
  tls: {secretName: talos-wildcard-tls}