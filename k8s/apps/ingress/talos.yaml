# Internal-only *.talos access: wildcard certs (signed by the talos-ca-issuer
# root) + Traefik IngressRoutes on short hostnames. No NodePorts, no public DNS.
# Each *.talos host resolves to the VIP 10.0.0.60 via UniFi DNS.

# --- apps namespace wildcard cert + routes ---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: talos-wildcard
  namespace: apps
spec:
  secretName: talos-wildcard-tls
  dnsNames: ["*.talos"]
  issuerRef: {name: talos-ca-issuer, kind: ClusterIssuer}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: home-talos, namespace: apps}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`home.talos`)
      kind: Rule
      services: [{name: homepage, port: 3000}]
  tls: {secretName: talos-wildcard-tls}
---
