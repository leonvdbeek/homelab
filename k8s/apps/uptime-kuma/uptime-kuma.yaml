# uptime-kuma (uptime.leonvdbeek.com) — data on an iSCSI PVC (777M migrated).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: truenas-iscsi-fast
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: apps
spec:
  replicas: 1
  selector: {matchLabels: {app: uptime-kuma}}
  template:
    metadata: {labels: {app: uptime-kuma}}
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:latest
          ports: [{name: http, containerPort: 3001}]
          volumeMounts:
            - {name: data, mountPath: /app/data}
          readinessProbe: {httpGet: {path: /, port: 3001}, initialDelaySeconds: 10}
          resources: {limits: {memory: 512Mi}}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: uptime-kuma-data}
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: apps
spec:
  selector: {app: uptime-kuma}
  ports: [{name: http, port: 3001, targetPort: 3001}]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: uptime-cert, namespace: apps}
spec:
  secretName: uptime-cert
  dnsNames: [uptime.leonvdbeek.com]
  issuerRef: {name: letsencrypt, kind: ClusterIssuer}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: uptime-route, namespace: apps}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`uptime.leonvdbeek.com`)
      kind: Rule
      services: [{name: uptime-kuma, port: 3001}]
  tls: {secretName: uptime-cert}