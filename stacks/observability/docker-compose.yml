# Observability stack — replaces the previous prometheus and grafana stacks.
# Reuses the existing grafana_grafana-storage named volume (via `external`) and
# the on-host prometheus data directory, so this migration preserves history.

networks:
  proxy:
    external: true

volumes:
  grafana-data:
    name: grafana_grafana-storage
    external: true

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    user: "1000:1000"            # match existing on-host data ownership (leon)
    networks: [proxy]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /home/leon/portainer/prometheus/data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle      # so `curl -X POST .../-/reload` works
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.prometheus.rule: Host(`prometheus.leonvdbeek.com`)
      traefik.http.routers.prometheus.entrypoints: http
      traefik.http.routers.prometheus.middlewares: prometheus-https-redirect
      traefik.http.middlewares.prometheus-https-redirect.redirectscheme.scheme: https
      traefik.http.routers.prometheus-secure.rule: Host(`prometheus.leonvdbeek.com`)
      traefik.http.routers.prometheus-secure.entrypoints: https
      traefik.http.routers.prometheus-secure.tls: "true"
      traefik.http.routers.prometheus-secure.middlewares: authentik@file
      traefik.http.routers.prometheus-secure.service: prometheus
      traefik.http.services.prometheus.loadbalancer.server.port: "9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    user: "1000:1000"            # existing grafana_grafana-storage volume is owned by uid 1000
    networks: [proxy]
    ports:
      - "3100:3000"
    env_file: .env
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.grafana.rule: Host(`grafana.leonvdbeek.com`)
      traefik.http.routers.grafana.entrypoints: http
      traefik.http.routers.grafana.middlewares: grafana-https-redirect
      traefik.http.middlewares.grafana-https-redirect.redirectscheme.scheme: https
      traefik.http.routers.grafana-secure.rule: Host(`grafana.leonvdbeek.com`)
      traefik.http.routers.grafana-secure.entrypoints: https
      traefik.http.routers.grafana-secure.tls: "true"
      traefik.http.routers.grafana-secure.middlewares: authentik@file
      traefik.http.routers.grafana-secure.service: grafana
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
